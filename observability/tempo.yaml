# Tempo receives traces directly over OTLP from the otel-collector, and — via the metrics-generator
# below — turns every span into Prometheus RED metrics (rate/errors/duration) and a service graph,
# with no extra instrumentation needed on the app side. That's how the "how long did the DB call /
# downstream HTTP call take" panels get their data, straight from the spans HttpClient/Npgsql
# instrumentation already produce.
server:
  http_listen_port: 3200

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318

ingester:
  max_block_duration: 5m

compactor:
  compaction:
    block_retention: 24h

metrics_generator:
  registry:
    external_labels:
      source: tempo
  storage:
    path: /tmp/tempo/generator/wal
    remote_write:
      - url: http://prometheus:9090/api/v1/write
        send_exemplars: true
  traces_storage:
    path: /tmp/tempo/generator/traces
  processor:
    span_metrics:
      dimensions:
        - http.method
        - http.status_code
        - db.system
        - error.code
    service_graphs:
      dimensions:
        - http.method

overrides:
  defaults:
    metrics_generator:
      processors: [span-metrics, service-graphs]

storage:
  trace:
    backend: local
    local:
      path: /tmp/tempo/blocks
    wal:
      path: /tmp/tempo/wal
